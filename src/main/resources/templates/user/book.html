
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Book Appointment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="blur-circle blur1"></div>
<div class="blur-circle blur2"></div>
<div th:replace="fragments/navbar :: navbar"></div>

<h2>Book Appointment</h2>

<!-- ✅ Error Message -->
<p th:if="${error}" th:text="${error}"></p>

<!-- ✅ Success Message -->
<p th:if="${param.success}">
    Appointment booked successfully!
</p>

<form th:action="@{/user/book}" method="post" th:object="${appointment}">

    <label>Select Doctor:</label>

    <select th:field="*{doctor}" required>
        <option th:each="d : ${doctors}"
                th:value="${d.id}"
                th:text="${d.name + ' - ' + d.specialization}">
        </option>
    </select>

    <br><br>

    <label>Date:</label>
    <input type="date" th:field="*{date}" required>

    <br><br>

    <label>Time:</label>
    <input type="time" th:field="*{time}" required>

    <br><br>

    <button type="submit">Book</button>

</form>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
