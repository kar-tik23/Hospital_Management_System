<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Appointments</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="blur-circle blur1"></div>
<div class="blur-circle blur2"></div>
<div th:replace="fragments/navbar :: navbar"></div>

<h2>My Appointments</h2>

<table border="1">
    <tr>
        <th>Doctor</th>
        <th>Date</th>
        <th>Time</th>
        <th>Token</th>
        <th>Status</th>
    </tr>

    <tr th:each="a : ${appointments}">
        <td th:text="${a.doctor.name}"></td>
        <td th:text="${a.date}"></td>
        <td th:text="${a.time}"></td>
        <td th:text="${a.tokenNumber}"></td>
        <td th:text="${a.status}"></td>
        <td><a th:if="${a.doctor != null}"
               th:href="@{/user/queue/{doctorId}(doctorId=${a.doctor.id})}">
            Live Queue
        </a></td>

    </tr>
</table>

<br>
<a href="/dashboard">Back</a>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
